version: '3.8'
services:

  web:
    container_name: drive-ui
    image: drive/drive-ui:5.0.0
    ports:
      - 8000:80
    environment:
      API_URL: http://localhost:5108/api
      AUTH_URL: http://localhost:5108/api
    networks:
      - elastic
  drive-api:
    image: drive-api:2.1.1
    container_name: drive-api
    build: ./backend
    ports:
      #destination:source
      - "5108:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=mazraa;Username=mazraa;Password=mazraa
    # volumes:
    #   - ./backend/keys:/app/keys
    deploy:
      replicas: 3
    depends_on:
      - postgres
    networks:
      - elastic

  postgres:
    image: postgres:15
    container_name: postgres-db
    environment:
      POSTGRES_USER: mazraa
      POSTGRES_PASSWORD: mazraa
      POSTGRES_DB: mazraa
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - elastic
  es01:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
      - xpack.security.enabled=false  
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - esdata:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"
    networks:
      - elastic
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      
  kib01:
    image: docker.elastic.co/kibana/kibana:8.11.0
    container_name: kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://es01:9200
    ports:
      - "5601:5601"
    networks:
      - elastic
    depends_on:
      es01:
        condition: service_healthy
    restart: unless-stopped
  jenkins:
    image: jenkins/jenkins:lts
    container_name: jenkins
    ports:
      - "8080:8080" # Jenkins UI
      - "50000:50000" # Jenkins agent communication
    volumes:
      - jenkins_home:/var/jenkins_home
    networks:
      - elastic
networks:
  elastic:
    driver: bridge

volumes:
  jenkins_home:
    driver: local
  postgres-data:
    driver: local
  esdata:
    driver: local