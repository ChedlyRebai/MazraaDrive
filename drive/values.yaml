
ingress:
  enabled: true
  className: nginx
  frontendHost: frontend.drive.com
  apiHost: api.drive.com

# Valeurs propagées aux subcharts (exemples)
backend:
  image: chedlyrebai/drive-api:latest
  elasticsearch:
    url: http://elasticsearch-master:9200   # nom du service elasticsearch

frontend:
  image: chedlyrebai/drive-front:latest
  apiUrl: http://backend-backend:8080/api   # nom du service backend

postgres:
  image: postgres:15
  auth:
    database: mazraa
    username: mazraa
    password: mazraa-change-me
  persistence:
    size: 1Gi
  enable: true

elasticsearch:
  image: docker.elastic.co/elasticsearch/elasticsearch:7.12.0   # ou 8.x plus tard
  replicas: 1
  heapSize: "512m"
  persistence:
    size: 1Gi
  security:
    elasticPassword: change-me-strong
  enable: true

kibana:
  image: docker.elastic.co/kibana/kibana:7.12.0
  enable: true