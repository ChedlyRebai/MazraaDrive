# Global configuration
replicaCount: 1

image:
  repository: chedlyrebai/drive-app
  pullPolicy: IfNotPresent
  tag: "latest"

service:
  type: ClusterIP
  port: 8080

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 250m
    memory: 256Mi

ingress:
  enabled: false
  className: nginx
  frontendHost: frontend.drive.com
  apiHost: api.drive.com

# Valeurs propagées aux subcharts (exemples)
backend:
  image: chedlyrebai/drive-api:latest
  elasticsearch:
    url: http://elasticsearch-master:9200   # nom du service elasticsearch

frontend:
  image: chedlyrebai/drive-front:latest
  apiUrl: http://backend-backend:8080/api   # nom du service backend

postgres:
  image: postgres:15
  auth:
    database: mazraa
    username: mazraa
    password: mazraa
  persistence:
    size: 1Gi
  enable: true

elasticsearch:
  image: docker.elastic.co/elasticsearch/elasticsearch:7.12.0   # ou 8.x plus tard
  replicas: 1
  heapSize: "512m"
  persistence:
    size: 1Gi
  security:
    elasticPassword: mazraa
  enable: true

kibana:
  image: docker.elastic.co/kibana/kibana:7.12.0
  enable: true

# ArgoCD configuration
argo-cd:
  enabled: true
  
  # Create namespace
  createNamespace: true
  
  # ArgoCD server configuration
  server:
    service:
      type: LoadBalancer
    ingress:
      enabled: true
      ingressClassName: nginx
      hosts:
        - argocd.drive.com
  
  # ArgoCD repo server
  repoServer:
    resources:
      limits:
        cpu: 250m
        memory: 256Mi
      requests:
        cpu: 100m
        memory: 128Mi
  
  # ArgoCD application controller
  controller:
    resources:
      limits:
        cpu: 500m
        memory: 512Mi
      requests:
        cpu: 250m
        memory: 256Mi
  
  # Initial admin password (change in production!)
  configs:
    secret:
      argocdServerAdminPassword: "admin123"

