apiVersion: v2
name: drive
description: Helm chart pour l'application Drive (frontend + backend + postgres + ELK)

type: application

version: 0.1.0

appVersion: "1.16.0"

dependencies:
  - name: frontend
    version: "0.1.0"
    repository: "file://./charts/frontend"

  - name: backend 
    version: "0.1.0"
    repository: "file://./charts/backend"
    
  - name: postgres
    version: "0.1.0"
    repository: "file://./charts/postgres"
  
  - name: elasticsearch
    version: "0.1.0"
    repository: "file://./charts/elasticsearch"
    condition: elasticsearch.enable

  - name: kibana
    version: "0.1.0"
    repository: "file://./charts/kibana"
    condition: kibana.enable
