apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
type: Opaque
stringData:
  POSTGRES_DB: {{ .Values.auth.database | quote }}
  POSTGRES_USER: {{ .Values.auth.username | quote }}
  POSTGRES_PASSWORD: {{ .Values.auth.password | quote }}
  ConnectionStrings__DefaultConnection: {{ printf "Host=postgres-service:5432;Database=%s;Username=%s;Password=%s" .Values.auth.database .Values.auth.username .Values.auth.password | quote }}