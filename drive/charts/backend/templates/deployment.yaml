apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-deployment
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
      - name: backend
        image: {{ .Values.image }}
        ports:
        - containerPort: {{ .Values.port }}
        env:
        - name: ConnectionStrings__DefaultConnection
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: ConnectionStrings__DefaultConnection
        - name: Elasticsearch__Username
          valueFrom:
            secretKeyRef:
              name: elasticsearch-secret
              key: username
        - name: Elasticsearch__Password
          valueFrom:
            secretKeyRef:
              name: elasticsearch-secret
              key: password
        - name: Elasticsearch__Url
          value: {{ .Values.elasticsearchUrl | quote }}
        resources:
          requests:
            cpu: "250m"
            memory: "64Mi"
          limits:
            cpu: "500m"
            memory: "128Mi"