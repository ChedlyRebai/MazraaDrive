apiVersion: apps/v1
kind: Deployment
metadata:
  name: front-app-deployment
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: front-app
  template:
    metadata:
      labels:
        app: front-app
    spec:
      containers:
      - name: front-app
        image: {{ .Values.images.frontend }}
        ports:
        - containerPort: {{ .Values.frontend.port }}
        env:
        - name: API_URL
          value: {{ .Values.frontend.apiUrl | quote }}
        - name: AUTH_URL
          value: {{ .Values.frontend.authUrl | quote }}
        resources:
          requests:
            memory: "64Mi"
            cpu: "250m"
          limits:
            memory: "128Mi"
            cpu: "500m"