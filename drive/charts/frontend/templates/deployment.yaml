apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-deployment
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
      - name: frontend
        image: {{ .Values.image }}
        ports:
        - containerPort: {{ .Values.port }}
        env:
        - name: API_URL
          value: {{ .Values.apiUrl | quote }}
        - name: AUTH_URL
          value: {{ .Values.authUrl | quote }}
        resources:
          requests:
            cpu: "250m"
            memory: "64Mi"
          limits:
            cpu: "500m"
            memory: "128Mi"