apiVersion: v1
kind: ConfigMap
metadata:
  name: elasticsearch-config
data:
  elasticsearch.yml: |
    cluster.name: drive-elastic
    node.name: node-1
    network.host: 0.0.0.0
    http.port: 9200
    discovery.type: single-node
    bootstrap.memory_lock: false
    xpack.security.enabled: true
    xpack.security.authc.api_key.enabled: true