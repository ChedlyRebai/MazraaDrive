apiVersion: v1
kind: Secret
metadata:
  name: kibana-secret
  namespace: {{ .Release.Namespace }}
type: Opaque
stringData:
  ELASTICSEARCH_USERNAME: {{ .Values.ELASTICSEARCH_USERNAME | quote }}
  ELASTICSEARCH_PASSWORD: {{ .Values.ELASTICSEARCH_PASSWORD | quote }}
  KIBANA_USERNAME: {{ .Values.KIBANA_USERNAME | quote }}
  KIBANA_PASSWORD: {{ .Values.KIBANA_PASSWORD | quote }}