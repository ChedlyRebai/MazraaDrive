{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ingress-srv
  annotations:
    kubernetes.io/ingress.class: {{ .Values.ingress.className }}
    nginx.ingress.kubernetes.io/use-regex: "true"
spec:
  rules:
  - host: {{ .Values.ingress.frontendHost }}
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: angular-app-srv
            port:
              number: 80
  - host: {{ .Values.ingress.apiHost }}
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: back-app-srv
            port:
              number: 8080
{{- end }}