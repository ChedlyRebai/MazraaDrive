{{- if .Values.postgres.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
type: Opaque
stringData:
  POSTGRES_DB: {{ .Values.postgres.dbName | quote }}
  POSTGRES_USER: {{ .Values.postgres.user | quote }}
  POSTGRES_PASSWORD: {{ .Values.postgres.password | quote }}
  ConnectionStrings__DefaultConnection: {{ printf "Host=postgres-srv;Port=5432;Database=%s;Username=%s;Password=%s" .Values.postgres.dbName .Values.postgres.user .Values.postgres.password | quote }}
{{- end }}