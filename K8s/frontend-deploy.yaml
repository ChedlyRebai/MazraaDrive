apiVersion: apps/v1
kind: Deployment
metadata:
  name: front-app-deployment
spec:
  replicas: 1
  selector :
    matchLabels:
      app: front-app
  template:
    metadata:
      labels:
        app: front-app
    spec:
      containers:
        - name: front-app
          image: chedlyrebai/drive-front:latest
          ports:
            - containerPort: 80
          env:
            - name: API_URL
              value: "http://back-app-service:8080/api"
            - name: AUTH_URL
              value: "http://back-app-service:8080/api"
          resources:
            requests:
              memory: "64Mi"
              cpu: "250m"
            limits:
              memory: "128Mi"
              cpu: "500m"
---
apiVersion: v1
kind: Service
metadata: 
  name: angular-app-srv
spec:
  selector:
    app: front-app
  type: ClusterIP
  ports:
  - protocol: TCP
    port: 80
    targetPort: 80