apiVersion: v1
kind: Deployment
metadata:
  name: front-app-deployment
spec:
  replicas: 2
  slector:
    matchLabels:
      app: front-app
  template:
    metadata:
      labels:
        app: front-app
    spec:
      containers:
        - name: front-app
          image: chedlyrebai/drive-ui:latest
          ports:
            - containerPort: 80
          resources:
            requests:
              memory: "64Mi"
              cpu: "250m"
            limits:
              memory: "128Mi"
              cpu: "500m"
---
apiVersion: v1
kind: Service
metadata: 
  name: angular-app-service
spec:
  selector:
    app: front-app
  type: ClusterIP
  ports:
  - protocol: TCP
    port: 80
    targetPort: 80