apiVersion: apps/v1
kind: Deployment
metadata:
  name: back-app-deployment
spec:
  replicas : 2
  selector :
    matchLabels:
      app: back-app
  template:
    metadata:
      labels:
        app: back-app
    spec:
      containers:
        - name: back-app
          image: chedlyrebai/drive-api:latest
          ports:
            - containerPort: 8080
          env:
            - name:  ConnectionStrings__DefaultConnection
              valueFrom:
                secretKeyRef:
                  name:  postgres-secret
                  key:  ConnectionStrings__DefaultConnection
          resources:
            requests:
              memory: "64Mi"
              cpu: "250m"
            limits:
              memory: "128Mi"
              cpu: "500m"
---
apiVersion: v1
kind: Service
metadata: 
  name: back-app-srv
spec:
  selector:
    app: back-app
  type: ClusterIP
  ports:
  - protocol: TCP
    port: 8080
    targetPort: 8080