apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ingress-srv
  annotations:
    ubernetes.io/spec.ingressClassName: nginx
    nginx.ingress.kubernetes.io/use-regex: 'true'
spec:
  rules:
    - host: forntend.drive.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: angular-app-srv
                port:
                  number: 80
    - host: api.drive.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: back-app-srv
                port:
                  number: 8080