        </app-files><!---->
          <p-dialog [(visible)]="folderDialog" [style]="{ width: '450px' }" header="New Folder" [modal]="true">
        <ng-template #content>
            <div class="flex flex-col gap-6">
              
                <div>
                    <label for="name" class="block font-bold mb-3">Name</label>
                    <input type="text" pInputText id="name" [(ngModel)]="newFolder.name" required autofocus fluid />
                    <small class="text-red-500" *ngIf="submitted && !newFolder.name">Name is required.</small>
                </div>
                <div>
                    <label for="description" class="block font-bold mb-3">Description</label>
                    <textarea id="description" pTextarea [(ngModel)]="newFolder.description" required rows="3" cols="20" fluid></textarea>
                </div>

              
               

               
            </div>
        </ng-template>

        <ng-template #footer>
            <p-button label="Cancel" icon="pi pi-times" text (click)="hideDialog()" />
            <p-button label="Save" icon="pi pi-check" (click)="saveFolder()" />
        </ng-template>
    </p-dialog>
     <p-confirmDialog [style]="{ width: '450px' }" />
