<div class="card h-full">
    <ngx-doc-viewer [url]='fileurl' [viewer]="'url'" style="width:100%;height:90vh;">
    </ngx-doc-viewer>
    <div *ngIf="file.fileType === 'pdf'">
        <pdf-viewer [src]="fileurl" [render-text]="true" style="display: block;"></pdf-viewer>
    </div>

    <div *ngIf="file.fileType.startsWith('image')">
        <img [src]="fileurl" class="img-fluid" />
    </div>

    <div *ngIf="file.fileType === 'txt'">
        <iframe [src]="fileurl" width="100%" height="600px"></iframe>
    </div>

    <div *ngIf="file.fileType === 'doc' || file.fileType === 'docx'">
        <iframe [src]="getGoogleViewerUrl(fileurl)" width="100%" height="600px"></iframe>
    </div>

</div>
