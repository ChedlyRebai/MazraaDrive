<theme-switcher />
<div class="card">
    <p-table #dt [value]="customers" [(selection)]="selectedCustomers" dataKey="id" [rowHover]="true" [rows]="10"
        [showCurrentPageReport]="true" [rowsPerPageOptions]="[10, 25, 50]" [loading]="loading" [paginator]="true"
        currentPageReportTemplate="Showing {first} to {last} of {totalRecords} entries" [filterDelay]="0"
        [globalFilterFields]="['name', 'country.name', 'representative.name', 'status']">
        <ng-template #caption>
            <div class="flex justify-between">
                <div>
                    <p-button class="mr-2" [outlined]="true" icon="pi pi-refresh" />

                </div>
                <p-iconField iconPosition="left">

                    <p-button (click)="showDialog()" label="Ajouter une Demande" icon="pi pi-plus" />
                </p-iconField>
            </div>
        </ng-template>
        <ng-template #header>
            <tr>
                <th style="width: 4rem">
                    <p-tableHeaderCheckbox />
                </th>
                <th pSortableColumn="name" style="min-width: 14rem">
                    <div class="flex justify-between items-center gap-2">
                        Nom
                        <p-sortIcon field="name" />
                        <p-columnFilter type="text" field="name" display="menu" class="ml-auto" />
                    </div>
                </th>
                <th pSortableColumn="country.name" style="min-width: 14rem">
                    <div class="flex justify-between items-center gap-2">
                        Demande
                        <p-sortIcon field="country.name" />
                        <p-columnFilter type="text" field="country.name" display="menu" class="ml-auto" />
                    </div>
                </th>



                <th pSortableColumn="status" style="min-width: 14rem">
                    <div class="flex justify-between items-center gap-2">
                        Type de Demande
                        <p-sortIcon field="status" />
                        <p-columnFilter field="status" matchMode="equals" display="menu" class="ml-auto">
                            <ng-template #filter let-value let-filter="filterCallback">
                                <p-dropdown [options]="statuses" placeholder="Any">
                                    <ng-template let-option #item>
                                        <p-tag [value]="option.label" [severity]="getSeverity(option.label)" />
                                    </ng-template>
                                </p-dropdown>
                            </ng-template>
                        </p-columnFilter>
                    </div>
                </th>
                <th pSortableColumn="date" style="min-width: 14rem">
                    <div class="flex justify-between items-center gap-2">
                        Date
                        <p-sortIcon field="date" />
                        <p-columnFilter type="date" field="date" display="menu" class="ml-auto" />
                    </div>
                </th>

            </tr>
        </ng-template>
        <ng-template #body let-customer>
            <tr class="p-selectable-row">
                <td>
                    <p-tableCheckbox [value]="customer" />
                </td>
                <td>
                    <div class="flex items-center gap-2">
                        <img [alt]="customer.representative.name"
                            src="https://primefaces.org/cdn/primeng/images/demo/avatar/{{ customer.representative.image }}"
                            width="32" style="vertical-align: middle" />
                        <span class="ml-1 align-middle">{{ customer.representative.name }}</span>
                    </div>
                </td>
                <!-- <td>
                    {{ customer.name }}
                </td> -->

                <td>
                    <div class="flex items-center gap-2">

                        <span class="ml-1 align-middle">{{ customer.representative.name }}</span>
                    </div>
                </td>

                <!-- <td>
                    {{ customer.balance | currency: 'USD' : 'symbol' }}
                </td> -->
                <td>
                    <p-tag [value]="customer.status" [severity]="getSeverity(customer.status)" />
                </td>
                <td>
                    {{ customer.date | date: 'MM/dd/yyyy' }}
                </td>


            </tr>
        </ng-template>
        <!-- <ng-template #emptymessage>
            <tr>
                <td colspan="8">No customers found.</td>
            </tr>
        </ng-template> -->
    </p-table>
</div>



<p-dialog header="Edit Profile"  [modal]="true" [(visible)]="visible" [style]="{ width: '40rem' }">
    <span class="p-text-secondary block mb-8">Update your information.</span>
    <div class="col-span-12">
        <label for="to"
            class="text-surface-900 dark:text-surface-0 font-semibold">To</label><p-iconfield
            class="p-iconfield mt-4 p-iconfield-left" style="height: 3.5rem;" pc6152=""><p-inputicon
                class="pi pi-user p-inputicon" style="left: 1.5rem;" pc6153=""></p-inputicon><input id="to" type="text"
                pinputtext="" fluid=""
                class="p-inputtext p-component !pl-16 text-surface-900 dark:text-surface-0 font-semibold ng-pristine ng-valid p-inputtext-fluid ng-touched"
                style="height: 3.5rem;" pc6154="">
        </p-iconfield>
    </div>

    <div class="col-span-12"><label for="Subject"
            class="text-surface-900 dark:text-surface-0 font-semibold">Subject</label><p-iconfield
            class="p-iconfield mt-4 p-iconfield-left" style="height: 3.5rem;" pc6155=""><p-inputicon
                class="pi pi-pencil p-inputicon" style="left: 1.5rem;" pc6156=""></p-inputicon><input id="subject"
                type="text" pinputtext="" placeholder="Subject" fluid=""
                class="p-inputtext p-component !pl-16 text-surface-900 dark:text-surface-0 font-semibold ng-pristine ng-valid p-inputtext-fluid ng-touched"
                style="height: 3.5rem;" pc6157=""></p-iconfield></div>
    <div class="flex justify-end gap-2">

        <p-editor [(ngModel)]="text" [style]="{ height: '320px' }" />

    </div>

</p-dialog>
