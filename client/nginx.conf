event{

}

http{
    server {
        listen 80;
        location / {
            root /usr/share/nginx/html;
            index index.html
            try_files $uri $uri/ /index.html;
        }

        #handle js | css files
        location \.(js|css)$ {
            root /usr/share/nginx/html;
            include /etc/nginx/mime.types;
        }

        #catch all other files
        location ~ ^/.+$ {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;
        }

    }
}